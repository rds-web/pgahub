<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PGA Engine Resource Hub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='8' fill='%23c9a227'/><path d='M50 50 L50 15 A8 8 0 0 1 58 15 Z' fill='%23ece8df'/><path d='M50 50 L85 50 A8 8 0 0 1 85 58 Z' fill='%23ece8df'/><path d='M50 50 L50 85 A8 8 0 0 0 42 85 Z' fill='%23ece8df'/><path d='M50 50 L15 50 A8 8 0 0 0 15 42 Z' fill='%23ece8df'/></svg>" />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root { --bg:#0c0e11; --card:#16191e; --line:#2a3038; --text:#ece8df; --muted:#9a9488; --accent:#c9a227; --bad:#e06a5c; --ok:#7dba8a; }
* { box-sizing:border-box; }
html,body { margin:0; background:var(--bg); color:var(--text); font-family:"IBM Plex Sans",system-ui,sans-serif; }
body::before { content:""; position:fixed; inset:0; z-index:0; pointer-events:none; background:linear-gradient(180deg,rgba(12,14,17,.72),rgba(12,14,17,.82)),url("bg-aerial.png") center/cover no-repeat fixed; opacity:.9; }
.app { position:relative; z-index:1; max-width:1800px; margin:0 auto; padding:18px 20px 100px; }
.top { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:18px; }
.brand { display: flex; flex-direction: row; align-items: center; gap: 20px; }
.brand img { height:72px; }
h1 { font-family:"Barlow Condensed",sans-serif; font-size:42px; margin:0; white-space:nowrap; }
.sub { color:var(--muted); font-size:14px; }
.meta { display:flex; gap:8px; }
.btn { background:#1b1f26; border:1px solid var(--line); color:var(--text); border-radius:10px; padding:8px 14px; font-size:13px; cursor:pointer; }
.btn:hover { background:#232830; }
.btn.primary { background:var(--accent); color:#111; border-color:var(--accent); font-weight:600; }
.mfr-btn { background: #1b1f26; border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; font-weight: 600; cursor: pointer; color: #fff; }
.mfr-btn[data-mfr="Continental"] { background: #c9a227; border-color: #c9a227; color: #fff; }
.mfr-btn[data-mfr="Lycoming"] { background: #1e5aa8; border-color: #1e5aa8; color: #fff; }
.mfr-btn[data-mfr="PropStrike"] { background: #e67e22; border-color: #e67e22; color: #fff; }
.mfr-btn[data-mfr="Repair"] { background: #27ae60; border-color: #27ae60; color: #fff; }
.mfr-btn[data-mfr="All"] { background: #2a3038; border-color: #2a3038; color: #fff; }
.mfr-btn.active { filter: brightness(1.1); }
.mfr-btn.pulse { animation: pulse-border .4s ease-out; }
@keyframes pulse-border {
  0% { box-shadow: 0 0 0 0 rgba(255,255,255,.8); }
  100% { box-shadow: 0 0 0 3px rgba(255,255,255,0); }
}
.mfr-filters { display: flex; gap: 10px; margin-bottom: 40px; flex-wrap: wrap; align-items: center; }
.grid { display: flex; flex-direction: column; gap: 16px; width: 100%; }
.family-block { display: flex; flex-direction: column; gap: 8px; width: 100%; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; cursor: pointer; width: 100%; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
.card h3 { margin: 0; font-family: "Barlow Condensed", sans-serif; font-size: 22px; min-width: 180px; }
.card .price { margin: 0; }
.home-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 36px 20px; cursor: pointer; text-align: center; color: var(--text); transition: border-color .15s, transform .12s; }
.home-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.home-icon { font-size: 56px; line-height: 1; margin-bottom: 12px; }
.home-title { font-family: "Barlow Condensed", sans-serif; font-size: 28px; letter-spacing: .02em; }
.home-sub { color: var(--muted); font-size: 14px; margin-top: 6px; }
.section-header { grid-column: 1 / -1; background: none; padding: 0 4px 6px; border: none; margin: 0; font-size: 12px; letter-spacing: .14em; color: var(--accent); text-transform: uppercase; font-weight: 600; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; cursor:pointer; }
.card:hover { border-color:#3a414b; }
.card h3 { margin:0 0 6px; font-family:"Barlow Condensed",sans-serif; font-size:22px; }
.card .mfr { font-size:11px; letter-spacing:.12em; color:var(--accent); text-transform:uppercase; }
.card .price { color:var(--ok); font-weight:600; margin-top:6px; }
.hidden { display:none !important; }
.detail { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; margin-top:12px; }
.modal { position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:100; display:none; align-items:center; justify-content:center; padding:20px; }
.modal.open { display:flex; }
.modal-content { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; width:min(640px,100%); max-height:90vh; overflow:auto; }
.form-row { margin-bottom:12px; }
.form-row label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
.form-row input, .form-row textarea { width:100%; background:#1b1f26; border:1px solid var(--line); border-radius:8px; padding:10px; color:var(--text); }
.form-row textarea { min-height:80px; }
.empty { color:var(--muted); font-style:italic; padding:12px; }
</style>
</head>
<body>
<div id="login-screen" style="position:fixed;inset:0;z-index:200;background:#0c0e11;display:flex;align-items:center;justify-content:center;padding:20px;">
  <div style="background:#16191e;border:1px solid #2a3038;border-radius:16px;padding:32px;width:min(400px,100%);text-align:center;">
    <img src="logo.png" alt="PGA" style="height:64px;margin-bottom:16px;" />
    <h2 style="font-family:'Barlow Condensed',sans-serif;margin:0 0 8px;">ENGINE RESOURCE HUB</h2>
    <div style="color:#9a9488;font-size:14px;margin-bottom:24px;">Sign in to continue</div>
    <input id="login-email" type="email" placeholder="Email" style="width:100%;background:#1b1f26;border:1px solid #2a3038;border-radius:10px;padding:12px;color:#ece8df;margin-bottom:10px;" />
    <input id="login-password" type="password" placeholder="Password" style="width:100%;background:#1b1f26;border:1px solid #2a3038;border-radius:10px;padding:12px;color:#ece8df;margin-bottom:16px;" />
    <button class="btn primary" id="btn-email-login" style="width:100%;margin-bottom:10px;">Sign in with Email</button>
    <button class="btn" id="btn-login" onclick="window.doGoogleLogin()" style="width:100%;">Sign in with Google</button>
    <div id="login-status" style="color:#9a9488;font-size:12px;margin-top:8px;">Loading...</div>
    <div id="login-error" style="color:#e06a5c;font-size:13px;margin-top:6px;min-height:18px;"></div>
  </div>
</div>
<div class="app" style="display:none;">
  <div class="top">
    <div class="brand">
      <img src="logo.png" alt="Poplar Grove Airmotive" />
      <div>
        <h1>ENGINE RESOURCE HUB</h1>
        <div class="sub">Sales & Engine Shop Knowledge Base</div>
      </div>
    </div>
    <div class="meta">
      <button class="btn" id="btn-home" onclick="window.goHome && window.goHome()">Home</button>
      <button class="btn" id="btn-engines" onclick="window.goEngines && window.goEngines()">Engines</button>
      <button class="btn" id="btn-daves" onclick="window.goDaves && window.goDaves()">Dave's Bench</button>
      <button class="btn" id="btn-targeted" onclick="window.goTargeted && window.goTargeted()">Targeted Issues</button>
      <span id="user-label" style="font-size:13px;color:var(--muted);margin-left:8px;"></span>
      <button class="btn" id="btn-logout" style="display:none;">Sign out</button>
    </div>
  </div>

  <div class="mfr-filters" style="flex-direction:column; align-items:flex-start;">
    <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; width:100%;">
      <button class="mfr-btn" data-mfr="All" onclick="window.filterMfr && window.filterMfr('All')">VIEW ALL</button>
      <button class="mfr-btn active" data-mfr="Continental" onclick="window.filterMfr && window.filterMfr('Continental')">CONTINENTAL</button>
      <button class="mfr-btn" data-mfr="Lycoming" onclick="window.filterMfr && window.filterMfr('Lycoming')">LYCOMING</button>
      <button class="mfr-btn" data-mfr="PropStrike" onclick="window.filterMfr && window.filterMfr('PropStrike')">PROP STRIKE INSPECTION</button>
      <button class="mfr-btn" data-mfr="Repair" onclick="window.filterMfr && window.filterMfr('Repair')">REPAIR</button>
    </div>
    <div style="position:relative; margin-top:10px;">
      <input type="search" id="search" placeholder="Search engine model..." style="background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 36px 10px 12px;color:var(--text);min-width:260px;" />
      <button id="search-clear" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;display:none;">×</button>
    </div>
  </div>

  <div id="view-home">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-top:12px;">
      <button class="home-card" onclick="window.goEngines && window.goEngines()">
        <div class="home-icon">⚙️</div>
        <div class="home-title">Engine Details</div>
        <div class="home-sub">All engines</div>
      </button>
      <button class="home-card" onclick="window.goTargeted && window.goTargeted()">
        <div class="home-icon">⚠️</div>
        <div class="home-title">Targeted Issues</div>
        <div class="home-sub">Known problems</div>
      </button>
      <button class="home-card" onclick="window.goDaves && window.goDaves()">
        <div class="home-icon">🔧</div>
        <div class="home-title">Dave's Bench</div>
        <div class="home-sub">Shop knowledge</div>
      </button>
    </div>
  </div>

  <div id="view-list" class="hidden">
    <div class="grid" id="engine-grid"></div>
  </div>

  <div id="view-detail" class="hidden">
    <button class="btn" id="btn-back">← Back</button>
    <div class="detail" id="detail-content"></div>
  </div>

  <div id="view-daves" class="hidden">
    <div class="detail">
      <h2 style="font-family:'Barlow Condensed',sans-serif;margin-top:0;">Dave's Bench</h2>
      <button class="btn primary" id="btn-add-dave" onclick="window.openDaveTip()">+ Add Tip</button>
      <div id="daves-list" style="margin-top:16px;"></div>
    </div>
  </div>

  <div id="view-targeted" class="hidden">
    <div class="detail">
      <h2 style="font-family:'Barlow Condensed',sans-serif;margin-top:0;">Targeted Issues</h2>
      <button class="btn primary" id="btn-add-targeted">+ Add Issue</button>
      <div id="targeted-list" style="margin-top:16px;"></div>
    </div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <h3 id="modal-title">Edit</h3>
    <div id="modal-body"></div>
    <div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end;">
      <button class="btn" id="modal-cancel" onclick="window.closeModal && window.closeModal()">Cancel</button>
      <button class="btn primary" id="modal-save" onclick="if(document.getElementById('f-title') && document.querySelector('#modal-title') && document.getElementById('modal-title').textContent.indexOf('Dave')>=0){window.saveDaveTip()}else if(window.saveModal){window.saveModal()}">Save</button>
    </div>
  </div>
</div>

window.goHome = function() { hideAll(); const el = document.getElementById('view-home'); if (el) el.classList.remove('hidden'); };
window.renderEngines = function(mfr) {
  hideAll();
  const el = document.getElementById('view-list');
  if (el) el.classList.remove('hidden');
  document.querySelectorAll('.mfr-btn').forEach(x => x.classList.remove('active'));
  const btn = document.querySelector('.mfr-btn[data-mfr="'+(mfr||'All')+'"]');
  if (btn) btn.classList.add('active');
  const data = window.ENGINE_DATA || [];
  const q = ((document.getElementById('search')||{}).value || '').toLowerCase();
  let list = data.filter(e => {
    if (!mfr || mfr === 'All' || mfr === 'PropStrike' || mfr === 'Repair') return true;
    return e.manufacturer === mfr;
  });
  if (q) list = list.filter(e => (e.model||'').toLowerCase().includes(q));
  const grid = document.getElementById('engine-grid');
  if (!grid) return;
  const propPrice = (e) => {
    const m = (e.model||'').toUpperCase();
    const turbo = m.startsWith('T') || m.includes('TSIO') || m.includes('TIO');
    const roller = m.includes('RT');
    const cyl = /540|550|520/.test(m) ? 6 : 4;
    if (e.manufacturer === 'Lycoming') {
      if (turbo && roller) return 29800;
      if (turbo && cyl===6) return 23500;
      if (roller && cyl===6) return 26500;
      if (roller) return 23250;
      if (cyl===6) return 21500;
      return 19250;
    }
    if (m.startsWith('E-')) return 25950;
    if (m.includes('IO-550-G') || m.includes('IO-550-N')) return 21500;
    if (turbo) return 23250;
    if (cyl===6) return 20950;
    return 18250;
  };
  grid.innerHTML = list.map(e => '<div class="card" data-id="'+e.id+'"><h3>'+e.model+'</h3>'+(e.price2026?'<div class="price">$'+Number(e.price2026).toLocaleString()+'</div>':'')+'<div class="price" style="color:#e67e22;">Prop Strike: $'+propPrice(e).toLocaleString()+'</div></div>').join('') || '<div class="empty">No engines</div>';
  grid.querySelectorAll('.card').forEach(c => { c.onclick = () => { if (window.openEngine) window.openEngine(c.dataset.id); }; });
};
window.goEngines = function() { window.renderEngines('All'); };

window.saveDaveTip = function() {
  const t = (document.getElementById('f-title')||{}).value || '';
  if (!t.trim()) { alert('Enter a title'); return; }
  const b = (document.getElementById('f-body')||{}).value || '';
  const sel = document.getElementById('f-engines');
  const engineIds = sel ? Array.from(sel.selectedOptions).map(o => o.value) : [];
  const linkTitle = (document.getElementById('f-link-title')||{}).value || '';
  const linkUrl = (document.getElementById('f-link-url')||{}).value || '';
  const linkDesc = (document.getElementById('f-link-desc')||{}).value || '';
  const links = (linkTitle && linkUrl) ? [{title:linkTitle, url:linkUrl, description:linkDesc}] : [];
  if (typeof davesTips === 'undefined') window.davesTips = window.davesTips || [];
  const tip = {title:t.trim(), body:b.trim(), date:new Date().toISOString().slice(0,10), engineIds, files:[], links};
  if (typeof davesTips !== 'undefined') davesTips.push(tip);
  else window.davesTips.push(tip);

  else if (typeof save === 'function') save();

};

window.continueIfSignedIn = function() {
  const errEl = document.getElementById('login-error');
  const statusEl = document.getElementById('login-status');
  if (typeof firebase === 'undefined' || !firebase.auth) {
    if (errEl) errEl.textContent = 'Firebase not loaded';
    return;
  }
  const u = firebase.auth().currentUser;
  if (!u) {
    if (statusEl) statusEl.textContent = 'No user in session';
    if (errEl) errEl.textContent = 'Not signed in yet. Use Sign in with Google first.';
    return;
  }
  if (statusEl) statusEl.textContent = 'Entering as ' + u.email;
  const loginScreen = document.getElementById('login-screen');
  const appEl = document.querySelector('.app');
  if (loginScreen) loginScreen.style.display = 'none';
  if (appEl) appEl.style.display = 'block';
  const logoutBtn = document.getElementById('btn-logout');
  const userLabel = document.getElementById('user-label');
  if (logoutBtn) {
    logoutBtn.style.display = 'inline-block';
    logoutBtn.onclick = () => firebase.auth().signOut().then(() => location.reload());
  }
  if (userLabel) userLabel.textContent = u.email || '';
  if (typeof showHome === 'function') showHome();
  if (typeof renderList === 'function') renderList();
  if (typeof bind === 'function') bind();
  setTimeout(() => { if (typeof bind === 'function') bind(); }, 100);
  if (window.enterApp) {
    try { window.enterApp(u); } catch(e) { if (errEl) errEl.textContent = e.message; }
  }
};
window.doGoogleLogin = function() {
  const errEl = document.getElementById('login-error');
  const statusEl = document.getElementById('login-status');
  if (typeof firebase === 'undefined' || !firebase.auth) {
    if (errEl) errEl.textContent = 'Firebase not loaded. Check your connection.';
    return;
  }
  try {
    const provider = new firebase.auth.GoogleAuthProvider();
    if (statusEl) statusEl.textContent = 'Opening Google...';
    firebase.auth().signInWithPopup(provider).then(function(result) {
      if (statusEl) statusEl.textContent = 'Signed in as ' + (result.user.email || '');
      if (window.continueIfSignedIn) window.continueIfSignedIn();
    }).catch(function(err) {
      if (errEl) errEl.textContent = (err.code || '') + ' ' + (err.message || err);
      if (statusEl) statusEl.textContent = 'Ready';
    });
  } catch(e) {
    if (errEl) errEl.textContent = e.message || String(e);
  }
};

function init() {
  engines = JSON.parse(JSON.stringify(EMBEDDED_ENGINES));
  const statusEl = document.getElementById('login-status');
  const errEl = document.getElementById('login-error');
  const loginScreen = document.getElementById('login-screen');
  const appEl = document.querySelector('.app');
  const setStatus = (t) => { if (statusEl) statusEl.textContent = t; };
  const setErr = (t) => { if (errEl) errEl.textContent = t || ''; };
  window.enterApp = enterApp;

  function enterApp(user) {
    setStatus('Signed in as ' + (user.email || 'user'));
    setErr('');
    loginScreen.style.display = 'none';
    appEl.style.display = 'block';
    const logoutBtn = document.getElementById('btn-logout');
    const userLabel = document.getElementById('user-label');
    if (logoutBtn) logoutBtn.style.display = 'inline-block';
    if (userLabel) userLabel.textContent = user.email || '';
    db.collection('hub').doc('main').get().then(snap => {
      if (snap.exists) {
        const data = snap.data();
        davesTips = data.davesTips || [];
        targetedIssues = data.targetedIssues || [];
        customSeries = data.customSeries || [];
        homeSlots = data.homeSlots || [null,null,null];
        if (Array.isArray(data.engineMeta)) {
          data.engineMeta.forEach(o => {
            const e = engines.find(x => x.id === o.id);
            if (e) Object.assign(e, o);
          });
        }
      }
    }).catch(()=>{}).finally(() => {
      showHome();
      renderList();
      bind();
    });
  }

  setStatus('Checking sign-in...');
  document.getElementById('btn-login').onclick = window.doGoogleLogin;
  document.getElementById('btn-check').onclick = () => {
    const u = auth.currentUser;
    if (u) enterApp(u);
    else setErr('No active sign-in found. Try Sign in with Google again.');
  };
  document.getElementById('btn-logout').onclick = () => auth.signOut();
  document.getElementById('btn-email-login').onclick = () => {
    const email = document.getElementById('login-email').value.trim();
    const pass = document.getElementById('login-password').value;
    if (!email || !pass) { setErr('Enter email and password'); return; }
    auth.signInWithEmailAndPassword(email, pass).catch(err => setErr(err.message));
  };

  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).then(() => {
    return auth.getRedirectResult();
  }).then(result => {
    if (result && result.user) {
      enterApp(result.user);
      return;
    }
    if (auth.currentUser) {
      enterApp(auth.currentUser);
      return;
    }
    setStatus('Ready — click Sign in with Google');
  }).catch(err => {
    setErr('Redirect error: ' + (err.code || '') + ' ' + (err.message || err));
    setStatus('Ready');
  });

  auth.onAuthStateChanged(user => {
    if (user) {
      if (window.continueIfSignedIn) window.continueIfSignedIn();
      else enterApp(user);
    } else {
      loginScreen.style.display = 'flex';
      appEl.style.display = 'none';
    }
  });
}

function save() {
  const engineMeta = engines.map(e => ({
    id: e.id,
    family: e.family || null,
    notAvailable: !!e.notAvailable,
    propStrike: !!e.propStrike,
    propStrikePrice: e.propStrikePrice || null,
    cylinderPN: e.cylinderPN || '',
    cylinderAvailable: !!e.cylinderAvailable,
    camshaftPN: e.camshaftPN || '',
    camshaftAvailable: !!e.camshaftAvailable
  }));
  const payload = { davesTips, targetedIssues, customSeries, engineMeta, homeSlots, updated: firebase.firestore.FieldValue.serverTimestamp() };
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ davesTips, targetedIssues, customSeries, engineMeta, homeSlots }));
  db.collection('hub').doc('main').set(payload, { merge: true }).catch(err => console.warn('Firestore save failed', err));
}

function getFamily(e) {
  if (e.family) return e.family;
  const m = (e.model || '').toUpperCase().replace(/['*]/g, '').trim();
  const match = m.match(/^([A-Z]+-?\d+)/);
  return match ? match[1] : m.split('-')[0];
}

function getPropStrikePrice(e) {
  if (e.propStrikePrice) return e.propStrikePrice;
  const m = (e.model||'').toUpperCase().replace(/['*]/g,'').trim();
  const isTurbo = m.startsWith('T') || m.includes('TSIO') || m.includes('TIO') || m.includes('LTIO') || m.includes('LTSIO');
  const isRoller = m.includes('- RT') || m.includes(' RT');
  const isE = m.startsWith('E-');
  let cyl = 4;
  if (['540','550','520'].some(x => m.includes(x))) cyl = 6;
  if (e.manufacturer === 'Lycoming') {
    if (isTurbo && isRoller) return 29800;
    if (isTurbo && cyl===6) return 23500;
    if (isRoller && cyl===6) return 26500;
    if (isRoller) return 23250;
    if (cyl===6) return 21500;
    return 19250;
  }
  if (isE) return 25950;
  if (m.includes('IO-550-G') || m.includes('IO-550-N')) return 21500;
  if (isTurbo) return 23250;
  if (cyl===6) return 20950;
  return 18250;
}

function renderHome() {
  const el = document.getElementById('home-attention');
  if (!el) return;
  el.innerHTML = [0,1,2].map(i => {
    const item = homeSlots[i] != null ? targetedIssues[homeSlots[i]] : null;
    return `<div style="background:#1b1f26;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;">

          <div style="font-size:11px;letter-spacing:.12em;color:var(--accent);">ITEM ${i+1}</div>
          ${item ? `<div style="font-weight:600;margin-top:6px;">${item.title}</div><div style="color:var(--muted);margin-top:4px;">${item.body||''}</div><div style="font-size:12px;color:var(--muted);margin-top:4px;">${item.engine||''}</div>` : '<div class="empty">No item selected</div>'}
        </div>
        <button class="btn" data-home-edit="${i}">Edit</button>
      </div>
    </div>`;
  }).join('');
  el.querySelectorAll('[data-home-edit]').forEach(btn => {
    btn.onclick = () => openHomePicker(Number(btn.dataset.homeEdit));
  });
}

function openHomePicker(slot) {
  if (!targetedIssues.length) { alert('Add items on the Targeted Issues page first.'); return; }
  const options = targetedIssues.map((t,i) => `${i+1}. ${t.title}${t.engine?' · '+t.engine:''}`).join('\n');
  const pick = prompt('Select item number:\n\n' + options);
  const idx = Number(pick) - 1;
  if (idx >= 0 && idx < targetedIssues.length) {
    homeSlots[slot] = idx;
    save();
    renderHome();
  }
}

  document.querySelectorAll('.mfr-btn').forEach(x => x.classList.remove('active'));

  if (btn) btn.classList.add('active');
  showList();
  if (typeof renderList === 'function') renderList();
};

function renderList() {
  try {
    if ((!engines || !engines.length) && typeof EMBEDDED_ENGINES !== 'undefined') {
      engines = JSON.parse(JSON.stringify(EMBEDDED_ENGINES));
    }
    const active = document.querySelector('.mfr-btn.active');
    const mfr = active ? active.dataset.mfr : '';
    const q = (document.getElementById('search')?.value || '').toLowerCase().trim();
    const list = (engines && engines.length) ? engines : (EMBEDDED_ENGINES || []);
    let filtered = list.filter(e => {
      if (!mfr || mfr === 'All') return true;
      if (mfr === 'PropStrike') return true;
      if (mfr === 'Repair') return e.repair === true;
      return e.manufacturer === mfr;
    });
    if (q) filtered = filtered.filter(e => (e.model||'').toLowerCase().includes(q));
    const grid = document.getElementById('engine-grid');
    if (!grid) return;
    if (!filtered.length) {
      grid.innerHTML = '<div class="empty">No engines (' + list.length + ' loaded)</div>';
      return;
    }
    grid.innerHTML = filtered.map(e => `
      <div class="card" data-id="${e.id}" style="cursor:pointer;">
        <h3>${e.model}</h3>
        <div class="price">${e.notAvailable ? 'n/a' : (e.price2026 ? '$'+Number(e.price2026).toLocaleString() : '')}</div>
      </div>
    `).join('');
    grid.querySelectorAll('.card').forEach(c => {
      c.onclick = () => { if (typeof openEngine === 'function') openEngine(c.dataset.id); };
    });
  } catch(err) {
    const grid = document.getElementById('engine-grid');
    if (grid) grid.innerHTML = '<div class="empty">Error: ' + err.message + '</div>';
  }
}

    setTimeout(() => document.getElementById('btn-del').onclick = () => { if(confirm('Delete?')) { engines = engines.filter(x=>x.id!==currentEngine.id); save(); closeModal(); showList(); renderList(); } }, 30);
  } else if (type === 'sub') {
    title.textContent = 'Add Sub-model';
    body.innerHTML = `<div class="form-row"><label>Name</label><input id="f-sub" /></div>`;
  } else if (type === 'tips' || type === 'documents') {
    title.textContent = 'Add ' + type;
    body.innerHTML = `<div class="form-row"><label>Title</label><input id="f-title" /></div><div class="form-row"><label>Details</label><textarea id="f-body"></textarea></div><div class="form-row"><label>Additional Details</label><textarea id="f-extra"></textarea></div>`;
  } else if (type === 'dave') {
    title.textContent = "Dave's Bench Tip";
    const engOptions = engines.map(e => `<option value="${e.id}">${e.manufacturer} ${e.model}</option>`).join('');
    body.innerHTML = `
      <div class="form-row"><label>Title</label><input id="f-title" /></div>
      <div class="form-row"><label>Description</label><textarea id="f-body"></textarea></div>
      <div class="form-row"><label>Link to engines (hold Ctrl/Cmd to select multiple)</label>
        <select id="f-engines" multiple style="height:120px;width:100%;background:#1b1f26;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:6px;">${engOptions}</select>
      </div>
      <div class="form-row"><label>Upload photo, PDF, or Excel</label>
        <input type="file" id="f-files" accept="image/*,.pdf,.xls,.xlsx" multiple />
        <div id="f-preview" style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;"></div>
      </div>
      <div class="form-row"><label>Web link title</label><input id="f-link-title" /></div>
      <div class="form-row"><label>Web link URL</label><input id="f-link-url" placeholder="https://" /></div>
      <div class="form-row"><label>Web link description</label><input id="f-link-desc" /></div>
    `;
    setTimeout(() => {
      document.getElementById('f-files').onchange = () => {
        const preview = document.getElementById('f-preview');
        preview.innerHTML = '';
        Array.from(document.getElementById('f-files').files).forEach(file => {
          const url = URL.createObjectURL(file);
          const isImg = file.type.startsWith('image/');
          preview.innerHTML += `<a href="${url}" target="_blank" style="display:block;width:72px;height:72px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#1b1f26;">
            ${isImg ? `<img src="${url}" style="width:100%;height:100%;object-fit:cover;" />` : `<div style="font-size:11px;padding:8px;color:var(--muted);">${file.name.split('.').pop().toUpperCase()}</div>`}
          </a>`;
        });
      };
    }, 30);
  } else if (type === 'targeted') {
    title.textContent = 'Targeted Issue';
    body.innerHTML = `<div class="form-row"><label>Title</label><input id="f-title" /></div><div class="form-row"><label>Details</label><textarea id="f-body"></textarea></div><div class="form-row"><label>Engine</label><input id="f-eng" /></div>`;
  }
}
window.openModal = openModal;
function closeModal() { document.getElementById('modal').classList.remove('open'); }
window.closeModal = closeModal;
async function saveModal() {
  const e = currentEngine;
  if (editContext === 'edit') {
    e.model = document.getElementById('f-model').value.trim() || e.model;
    const na = document.getElementById('f-na')?.checked;
    e.notAvailable = !!na;
    if (na) {
      e.price2026 = null;
    } else {
      const p = document.getElementById('f-price').value;
      if (p) e.price2026 = Number(p);
    }
    e.propStrike = document.getElementById('f-prop')?.checked || false;
    const psp = document.getElementById('f-prop-price')?.value;
    e.propStrikePrice = psp ? Number(psp) : null;
  } else if (editContext === 'sub') {
    const n = document.getElementById('f-sub').value.trim();
    if (n) { if (!e.submodels) e.submodels = []; e.submodels.push({model:n}); }
  } else if (editContext === 'tips' || editContext === 'documents') {
    const t = document.getElementById('f-title').value.trim();
    const b = document.getElementById('f-body').value.trim();
    const x = document.getElementById('f-extra')?.value.trim() || '';
    if (t) {
      if (!e.departments[currentDept][editContext]) e.departments[currentDept][editContext] = [];
      e.departments[currentDept][editContext].push({title:t, body:b+(x?'\n\n'+x:'')});
    }
  } else if (editContext === 'dave') {
    const t = document.getElementById('f-title').value.trim();
    const b = document.getElementById('f-body').value.trim();
    if (!t) return;
    const sel = document.getElementById('f-engines');
    const engineIds = Array.from(sel.selectedOptions).map(o => o.value);
    const linkTitle = document.getElementById('f-link-title').value.trim();
    const linkUrl = document.getElementById('f-link-url').value.trim();
    const linkDesc = document.getElementById('f-link-desc').value.trim();
    const links = (linkTitle && linkUrl) ? [{title:linkTitle, url:linkUrl, description:linkDesc}] : [];
    const files = [];
    const fileInput = document.getElementById('f-files');
    const uploadPromises = Array.from(fileInput.files || []).map(async file => {
      const path = `daves/${Date.now()}-${file.name}`;
      try {
        const ref = storage.ref(path);
        await ref.put(file);
        const url = await ref.getDownloadURL();
        files.push({name:file.name, type:file.type, url});
      } catch(err) {
        // fallback: store small files as data URL
        if (file.size < 800000) {
          const dataUrl = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(file); });
          files.push({name:file.name, type:file.type, url:dataUrl});
        }
      }
    });
    await Promise.all(uploadPromises);
    davesTips.push({title:t, body:b, date:new Date().toISOString().slice(0,10), engineIds, files, links});
    renderDaves();
  } else if (editContext === 'targeted') {
    const t = document.getElementById('f-title').value.trim();
    const b = document.getElementById('f-body').value.trim();
    const eng = document.getElementById('f-eng').value.trim();
    if (t) targetedIssues.push({title:t, body:b, engine:eng, date:new Date().toISOString().slice(0,10)});
    renderTargeted();
  }
  save();
  closeModal();
  if (currentEngine) renderDetail();
}
window.saveModal = saveModal;
function renderDaves() {
  document.getElementById('daves-list').innerHTML = davesTips.map(t => {
    const thumbs = (t.files||[]).map(f => {
      const isImg = (f.type||'').startsWith('image/');
      return `<a href="${f.url}" target="_blank" style="display:inline-block;width:64px;height:64px;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-right:6px;vertical-align:middle;">
        ${isImg ? `<img src="${f.url}" style="width:100%;height:100%;object-fit:cover;" />` : `<div style="font-size:10px;padding:6px;color:var(--muted);">${(f.name||'').split('.').pop().toUpperCase()}</div>`}
      </a>`;
    }).join('');
    const links = (t.links||[]).map(l => `<div style="margin-top:6px;"><a href="${l.url}" target="_blank" style="color:var(--accent);">${l.title||l.url}</a> <span style="color:var(--muted);">${l.description||''}</span></div>`).join('');
    const engNames = (t.engineIds||[]).map(id => { const e = engines.find(x=>x.id===id); return e ? e.model : ''; }).filter(Boolean).join(', ');
    return `<div style="background:#1b1f26;padding:10px;border-radius:8px;margin-bottom:8px;"><b>${t.title}</b><div style="color:var(--muted);">${t.body||''}</div>${engNames?`<div style="font-size:12px;color:var(--accent);margin-top:4px;">Engines: ${engNames}</div>`:''}<div style="margin-top:8px;">${thumbs}</div>${links}</div>`;
  }).join('') || '<div class="empty">None yet</div>';
}
function renderTargeted() {
  document.getElementById('targeted-list').innerHTML = targetedIssues.map(t => `<div style="background:#1b1f26;padding:10px;border-radius:8px;margin-bottom:8px;"><b>${t.title}</b> ${t.engine||''}<div style="color:var(--muted);">${t.body||''}</div></div>`).join('') || '<div class="empty">None yet</div>';
}
function bind() {
  document.getElementById('btn-home').onclick = window.goHome;
  document.getElementById('btn-engines').onclick = window.goEngines;
  document.getElementById('search').oninput = () => {
    const clearBtn = document.getElementById('search-clear');
    if (clearBtn) clearBtn.style.display = document.getElementById('search').value ? 'block' : 'none';
    const active = document.querySelector('.mfr-btn.active');
    window.renderEngines(active ? active.dataset.mfr : 'All');
  };
  document.getElementById('search-clear').onclick = () => {
    document.getElementById('search').value = '';
    document.getElementById('search-clear').style.display = 'none';
    const active = document.querySelector('.mfr-btn.active');
    window.renderEngines(active ? active.dataset.mfr : 'All');
  };
  document.querySelectorAll('.mfr-btn').forEach(b => b.onclick = () => window.filterMfr(b.dataset.mfr));
  document.getElementById('btn-back').onclick = showList;
  document.getElementById('btn-daves').onclick = () => {
    document.getElementById('view-list').classList.add('hidden');
    document.getElementById('view-detail').classList.add('hidden');
    document.getElementById('view-targeted').classList.add('hidden');
    document.getElementById('view-daves').classList.remove('hidden');
    renderDaves();
  };
  document.getElementById('btn-targeted').onclick = () => {
    document.getElementById('view-list').classList.add('hidden');
    document.getElementById('view-detail').classList.add('hidden');
    document.getElementById('view-daves').classList.add('hidden');
    document.getElementById('view-targeted').classList.remove('hidden');
    renderTargeted();
  };
  document.getElementById('btn-add-dave').onclick = () => window.openDaveTip();
  document.getElementById('btn-add-targeted').onclick = () => openModal('targeted');
  document.getElementById('modal-cancel').onclick = closeModal;
  document.getElementById('modal-save').onclick = saveModal;
  document.getElementById('modal').onclick = e => { if (e.target.id==='modal') closeModal(); };
}
init();
</script>
